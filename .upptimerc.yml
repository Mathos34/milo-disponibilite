# Disponibilité de Milo (milo-ece.com), relevée par Upptime depuis GitHub Actions.
# Chaque relevé est un commit de `history/` : l'historique du dépôt EST le registre de disponibilité.
owner: Mathos34
repo: milo-disponibilite

sites:
  # La santé de bout en bout : la route `/health` du site interroge l'API en interne
  # (200 sain, 503 dégradé). C'est ce que voit un élève.
  - name: Milo (milo-ece.com)
    url: https://milo-ece.com/health
    expectedStatusCodes:
      - 200
  # L'API seule, en profondeur (26/10/2026) : la base, Qdrant (la recherche dans les cours) et le stockage des
  # documents. 503 si la base ou Qdrant tombe ; « degraded » (200) si seul le stockage tombe. « /health » ne disait
  # que « le processus vit ».
  - name: API Milo
    url: https://api.milo-ece.com/health/profond
    expectedStatusCodes:
      - 200

# Une panne ouvre une issue assignée : GitHub prévient par courriel et sur l'application mobile.
assignees:
  - Mathos34

status-website:
  baseUrl: /milo-disponibilite
  name: Milo, disponibilité
  introTitle: "Disponibilité de **Milo**"
  introMessage: "Relevé automatique toutes les 5 minutes de [milo-ece.com/health](https://milo-ece.com/health), qui vérifie le site et l'API. L'historique complet est dans le [dépôt](https://github.com/Mathos34/milo-disponibilite)."
  navbar:
    - title: État
      href: /
    - title: Historique (GitHub)
      href: https://github.com/$OWNER/$REPO

i18n:
  activeIncidents: Incidents en cours
  allSystemsOperational: Tous les services fonctionnent
  pastIncidents: Incidents passés
  liveStatus: État en direct
  overallUptime: "Disponibilité globale : $UPTIME"
  overallUptimeTitle: Disponibilité globale
  averageResponseTime: "Temps de réponse moyen : $TIME ms"
  averageResponseTimeTitle: Temps de réponse moyen
  sevelDayResponseTime: Temps de réponse sur 7 jours
  responseTimeMs: Temps de réponse (ms)
  up: En ligne
  down: Hors ligne
  degraded: Dégradé
